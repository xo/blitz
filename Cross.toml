# Configuration for `cross` (https://github.com/cross-rs/cross).
# build-blitz.sh copies this into the blitz-c checkout, where cross looks for it.

# Apple targets build from locally produced cross-toolchain images. Build these
# once with cross-toolchains; the SDK is not redistributable, so there is no
# published image to pull.
[target.x86_64-apple-darwin]
image = "ghcr.io/cross-rs/x86_64-apple-darwin-cross:local"
pre-build = [
    "apt-get update && apt-get install --assume-yes --no-install-recommends cmake python3",
]

[target.aarch64-apple-darwin]
image = "ghcr.io/cross-rs/aarch64-apple-darwin-cross:local"
pre-build = [
    "apt-get update && apt-get install --assume-yes --no-install-recommends cmake python3",
]

# libblitz.a is a static archive of Rust code that still links system libraries
# dynamically: OpenSSL (via reqwest) and fontconfig. A cross build therefore
# needs those for the *target* architecture, which the stock images don't carry.
# cmake is for aws-lc-rs, the TLS crypto provider. python3 is for stylo, whose
# build script generates the CSS property tables — it runs on the host side of
# the container, so every target needs it, Windows included.
#
# $CROSS_DEB_ARCH is set by cross to the Debian arch matching the target.
[target.x86_64-unknown-linux-gnu]
pre-build = [
    "dpkg --add-architecture $CROSS_DEB_ARCH",
    "apt-get update && apt-get install --assume-yes --no-install-recommends pkg-config cmake python3 libssl-dev:$CROSS_DEB_ARCH libfontconfig1-dev:$CROSS_DEB_ARCH",
]

[target.aarch64-unknown-linux-gnu]
pre-build = [
    "dpkg --add-architecture $CROSS_DEB_ARCH",
    "apt-get update && apt-get install --assume-yes --no-install-recommends pkg-config cmake python3 libssl-dev:$CROSS_DEB_ARCH libfontconfig1-dev:$CROSS_DEB_ARCH",
]

[target.armv7-unknown-linux-gnueabihf]
pre-build = [
    "dpkg --add-architecture $CROSS_DEB_ARCH",
    "apt-get update && apt-get install --assume-yes --no-install-recommends pkg-config cmake python3 libssl-dev:$CROSS_DEB_ARCH libfontconfig1-dev:$CROSS_DEB_ARCH",
]

# Windows links schannel rather than OpenSSL, and uses DirectWrite rather than
# fontconfig, so it needs neither. nasm is for aws-lc-rs.
[target.x86_64-pc-windows-gnu]
pre-build = [
    "apt-get update && apt-get install --assume-yes --no-install-recommends cmake nasm python3",
]

[build.env]
passthrough = ["PKG_CONFIG_ALLOW_CROSS=1"]
