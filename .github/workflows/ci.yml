name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CGO_ENABLED: "1"

jobs:
  test:
    name: test / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # Nothing is compiled from Rust here — the archive is committed, so this is
    # a cgo link plus the Go tests.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-amd64
          - os: macos-latest
            target: macos-arm64   # macos-latest runners are Apple silicon
          - os: windows-latest
            target: windows-amd64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: false # nothing to cache; the module has no dependencies

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # fontconfig (and freetype under it) is linked dynamically by the
          # archives, so the dev package is needed at link time. The fonts
          # matter at run time: without them the renderer produces blank pages
          # and still reports success.
          sudo apt-get install -y --no-install-recommends \
            libfontconfig1-dev \
            fonts-liberation fonts-dejavu-core

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install fontconfig

      - name: Check for a mingw gcc
        if: runner.os == 'Windows'
        shell: pwsh
        # cgo needs one, and an MSVC-only image would otherwise fail much later
        # with a confusing error.
        run: gcc --version

      - name: Show the link flags the archives expect
        shell: bash
        # Recorded per target by build-blitz.sh. If the cgo link below fails with
        # undefined symbols, this is the list blitz.go should agree with.
        # Diagnostics only — never a gate, hence the `|| true`.
        continue-on-error: true
        run: |
          for f in libblitz/*/native-static-libs.txt; do
            [ -f "$f" ] || continue
            echo "$f:"; sed 's/^/  /' "$f" || true
          done

      - name: go vet
        run: go vet ./...

      - name: gofmt
        shell: bash
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed on: $unformatted"
            gofmt -d .
            exit 1
          fi

      # -race is not optional here. The package pins goroutines to OS threads to
      # keep the library's thread-local error slot coherent, and guards the
      # context pointer against a concurrent Close. Both are exactly the kind of
      # bug that only the race detector catches.
      - name: go test -race
        run: go test -race -v ./...

      - name: Build the example command
        run: go build -o bin/blitz-render ./cmd/blitz-render

      - name: Render through the CLI
        shell: bash
        run: |
          ./bin/blitz-render -no-net -w 900 -o cli-markdown.png testdata/sample.md
          ./bin/blitz-render -no-net -w 900 -o cli-html.png testdata/sample.html
          ls -l cli-*.png

      - name: Check the renders are not blank
        shell: bash
        # Size is the cheapest proxy for "fonts actually resolved". A missing
        # font stack produces a valid, nearly empty PNG.
        run: |
          for f in cli-markdown.png cli-html.png testdata/output/*.png; do
            [ -f "$f" ] || continue
            size=$(wc -c < "$f")
            echo "$f: $size bytes"
            if [ "$size" -lt 2048 ]; then
              echo "::error::$f is suspiciously small — missing fonts?"
              exit 1
            fi
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: renders-${{ matrix.os }}
          path: |
            cli-*.png
            testdata/output/*.png
          if-no-files-found: warn
          retention-days: 7

  network:
    name: live render (google.com)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Depends on an external site that can rate-limit or redirect datacenter
    # IPs. Informative, not a gate — the matrix above is the gate.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfontconfig1-dev \
            fonts-liberation fonts-dejavu-core

      - run: go test -race -v -network -run 'URL' ./...

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-renders
          path: testdata/output/*.png
          if-no-files-found: warn

  hygiene:
    name: committed file sizes + permissions
    runs-on: ubuntu-latest
    # Whether the archives exist and link is settled by `go build` in the test
    # matrix above, so nothing here inspects them. These are the two things a
    # build cannot tell you: that the files can be pushed at all, and that they
    # didn't arrive with cargo's executable bit still set.
    steps:
      - uses: actions/checkout@v4

      - name: No file over GitHub's 100 MiB limit
        shell: bash
        # GitHub rejects the push outright, so catching it here is the only way
        # to find out before the archives are unpushable. Splitting is
        # build-blitz.sh's job; this is the guard that it happened.
        run: |
          oversized=$(find . -path ./.git -prune -o -type f -size +100M -print)
          if [ -n "$oversized" ]; then
            echo "::error::over the 100 MiB file limit: $oversized"
            ls -lh $oversized
            exit 1
          fi
          echo "largest committed files:"
          find . -path ./.git -prune -o -type f -printf '%s %p\n' \
            | sort -rn | head -5 \
            | awk '{ printf "  %6.1f MiB  %s\n", $1/1048576, $2 }'

      - name: Archives are not executable
        run: |
          bad=$(find libblitz -name '*.a' -perm -u+x -print)
          if [ -n "$bad" ]; then
            echo "::error::executable bit set on: $bad (build-blitz.sh should chmod -x)"
            exit 1
          fi
